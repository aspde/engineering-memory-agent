# Alembic configuration for EMA.
#
# The database URL is intentionally NOT set here. It comes from the app's
# own config (backend/shared/config.py, DATABASE_URL env var) via
# migrations/env.py, so there is exactly one source of truth and no
# credentials duplicated in this file.
#
# NOTE: keep this file ASCII-only. Windows reads it with the locale
# (GBK) encoding, so any non-ASCII comment breaks config parsing.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Schema is managed with raw SQL (op.execute), not ORM metadata, so
# autogenerate has nothing to compare against. Run `alembic revision -m
# "..."` and hand-write upgrade()/downgrade().
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
