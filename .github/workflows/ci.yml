name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ema
          POSTGRES_PASSWORD: ema123
          POSTGRES_DB: ema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          # requirements.txt pins the CPU torch variant (a platform wheel not
          # on PyPI) — install it from the pytorch index first so the pinned
          # version resolves on Linux CI.  The version is read from
          # requirements.txt (single source of truth) so a bump there can't
          # silently diverge from this workflow.
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Zero-cost gate: ground-truth ↔ seed-corpus consistency (no DB, no
      # models). Catches dataset drift before anything is seeded.
      - name: Validate eval dataset
        run: python -m tests.eval.run_eval --validate-only

      # Unit + API tests are hermetic: unit tests mock LLM/embedding/DB; the
      # pytest session wipes & recreates ema_test (and creates it if missing,
      # which is why the service only needs to provision ema_dev).
      - name: Run backend tests
        run: python -m pytest tests/unit tests/api -q --tb=short

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
