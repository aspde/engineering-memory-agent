name: Retrieval Eval

on:
  workflow_dispatch:
    inputs:
      retriever:
        description: 'Retriever path to evaluate'
        required: false
        default: 'memory'
        type: choice
        options: [memory, chunk, vector, hybrid, hybrid_norerank, rewrite]
  schedule:
    # Weekly semantic eval — the semantic channel is on by default in
    # run_eval, so this is the recurring discriminant-quality gate.
    - cron: '47 6 * * 1'

# Full retrieval evaluation — needs the real BGE-M3 embedding model, the
# cross-encoder reranker, and a seeded corpus.  These are heavy (≈4 GB of
# model weights), so this runs on a weekly schedule (or manual dispatch),
# not on every push.  The cheap `--validate-only` gate lives in ci.yml
# instead — that guards dataset consistency at zero model cost; this
# workflow is where retrieval quality is actually measured (semantic
# channel enabled by default).
#
# Model weights are cached on the runner so repeat runs skip the download.

jobs:
  eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ema
          POSTGRES_PASSWORD: ema123
          POSTGRES_DB: ema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          # requirements.txt pins the CPU torch variant (a platform wheel not
          # on PyPI) — install it from the pytorch index first so the pinned
          # version resolves on Linux CI.  The version is read from
          # requirements.txt (single source of truth) so a bump there can't
          # silently diverge from this workflow.
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-eval-v1

      - name: Download embedding + reranker models
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-m3')"
          python -c "from sentence_transformers import CrossEncoder; CrossEncoder('BAAI/bge-reranker-v2-m3')"

      - name: Seed eval corpus (chunks + memories)
        run: python -m tests.eval.seed --clear --memories

      - name: Run retrieval eval
        run: |
          # `|| 'memory'` covers the cron path where `inputs` is empty.
          RETRIEVER="${{ inputs.retriever || 'memory' }}"
          # Regression gate: for the production-default memory config, fail
          # this step (run_eval exits non-zero) when overall quality drops
          # below the thresholds.  Manually dispatched non-memory retrievers
          # (experiments/baselines) are not gated.
          #
          # Calibrated 2026-08-08 on the seeded 30-query memory corpus
          # (recall@5=1.000, mrr≈0.94 across two runs).  recall@5 0.95 keeps
          # the core recall gate strict — 30 queries means at most one miss
          # passes.  mrr 0.87 leaves headroom for single-run noise (~±0.005
          # observed) and a rank-2/3 query or two, while still tripping on a
          # real ranking regression (2+ targets dropping out of the top).
          GATE_ARGS=""
          if [ "$RETRIEVER" = "memory" ]; then
            GATE_ARGS="--min-recall@5 0.95 --min-mrr 0.87"
          fi
          python -m tests.eval.run_eval --retriever "$RETRIEVER" \
            --report-md docs/interview/eval-report.md \
            --report-json eval-report.json $GATE_ARGS

      - name: Upload eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            docs/interview/eval-report.md
            eval-report.json

  # LLM behavior eval — tool selection / knowledge extraction / final-answer
  # groundedness.  Unlike the retrieval job this needs NO model weights and
  # NO database: each item costs a few real LLM calls via the configured
  # provider.  Requires the LLM_API_KEY secret (plus LLM_BASE_URL when not
  # the provider default).
  #
  # Gate thresholds below are conservative starting points, NOT yet
  # calibrated: as of 2026-08-08 no baseline report exists in
  # docs/interview/llm-eval-report.md (each run needs a valid LLM_API_KEY,
  # and the 2026-08-08 local probe key was invalid).  Until one lands, keep
  # these floors low enough that a healthy run passes.  After the first
  # report, calibrate them to the measured baselines (raise them so a
  # regression actually trips the job).
  llm-eval:
    name: LLM behavior eval
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
      # Dedicated judge provider — the judged model must NOT score its own
      # output (self-preference bias inflates every gate).  run_llm_eval now
      # hard-fails when --judge llm runs without a configured LLM_JUDGE_*
      # block, so these secrets must be set or this job fails loudly instead
      # of silently self-judging.
      LLM_JUDGE_PROVIDER: ${{ secrets.LLM_JUDGE_PROVIDER || '' }}
      LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL || '' }}
      LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY || '' }}
      LLM_JUDGE_BASE_URL: ${{ secrets.LLM_JUDGE_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run LLM behavior eval
        run: |
          # The three no-DB suites.  The e2e suite needs a seeded corpus and a
          # database — it runs in the dedicated `e2e-eval` job below.
          python -m tests.eval.run_llm_eval --suite tool_selection,extraction,answer \
            --report-md docs/interview/llm-eval-report.md \
            --report-json llm-eval-report.json \
            --min-tool-accuracy 0.70 \
            --min-entity-f1 0.60 \
            --min-relation-f1 0.50 \
            --min-fact-coverage 0.60 \
            --min-groundedness 0.80 \
            --min-citation-rate 0.80

      - name: Upload LLM eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-report
          path: |
            docs/interview/llm-eval-report.md
            llm-eval-report.json

  # End-to-end eval — the full chain "query → real retrieval → answer →
  # judge".  Needs the BGE-M3 embedding model (to embed the query against the
  # seeded corpus), a database (the e2e corpus is seeded here), and the LLM
  # provider (retrieval + answer generation + judge all call the LLM).  So it
  # gets its own postgres + model job rather than riding on `llm-eval`
  # (which has neither) or `eval` (which must stay LLM-free).
  #
  # Gate thresholds below are conservative starting points, NOT yet
  # calibrated — same policy as `llm-eval`: after the first report lands in
  # docs/interview/e2e-eval-report.md, raise them to the measured baselines
  # so a regression actually trips the job.
  e2e-eval:
    name: End-to-end eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ema
          POSTGRES_PASSWORD: ema123
          POSTGRES_DB: ema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
      # Dedicated judge provider — same requirement as the llm-eval job: the
      # e2e groundedness gate is only meaningful when the judge is a model
      # other than the one answering.  run_llm_eval hard-fails without it.
      LLM_JUDGE_PROVIDER: ${{ secrets.LLM_JUDGE_PROVIDER || '' }}
      LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL || '' }}
      LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY || '' }}
      LLM_JUDGE_BASE_URL: ${{ secrets.LLM_JUDGE_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-eval-v1

      - name: Download embedding model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-m3')"

      - name: Seed e2e eval corpus
        # Re-seed from scratch each run: clear the previous run's rows first
        # so the corpus is exactly the e2e labeled set, no accumulation.
        run: python -m tests.eval.e2e_seed --clear

      - name: Run end-to-end eval
        run: |
          python -m tests.eval.run_llm_eval --suite e2e \
            --report-md docs/interview/e2e-eval-report.md \
            --report-json e2e-eval-report.json \
            --min-context-recall 0.90 \
            --min-fact-coverage 0.70 \
            --min-groundedness 0.80 \
            --min-citation-rate 0.80

      - name: Upload e2e eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-eval-report
          path: |
            docs/interview/e2e-eval-report.md
            e2e-eval-report.json
