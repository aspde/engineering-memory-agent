name: Retrieval Eval

on:
  workflow_dispatch:
    inputs:
      retriever:
        description: 'Retriever path to evaluate'
        required: false
        default: 'memory'
        type: choice
        options: [memory, chunk, vector, hybrid, hybrid_norerank, rewrite]

# Full retrieval evaluation — needs the real BGE-M3 embedding model, the
# cross-encoder reranker, and a seeded corpus.  These are heavy (≈4 GB of
# model weights), so this runs only on manual dispatch (or a cron), not on
# every push.  The cheap `--validate-only` gate lives in ci.yml instead.
#
# Model weights are cached on the runner so repeat runs skip the download.

jobs:
  eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ema
          POSTGRES_PASSWORD: ema123
          POSTGRES_DB: ema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          # requirements.txt pins the CPU torch variant (a platform wheel not
          # on PyPI) — install it from the pytorch index first so the pinned
          # version resolves on Linux CI.
          pip install "torch==2.13.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-eval-v1

      - name: Download embedding + reranker models
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-m3')"
          python -c "from sentence_transformers import CrossEncoder; CrossEncoder('BAAI/bge-reranker-v2-m3')"

      - name: Seed eval corpus (chunks + memories)
        run: python -m tests.eval.seed --clear --memories

      - name: Run retrieval eval
        run: |
          python -m tests.eval.run_eval --retriever ${{ inputs.retriever }} \
            --semantic-relevance \
            --report-md docs/interview/eval-report.md \
            --report-json eval-report.json

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            docs/interview/eval-report.md
            eval-report.json
