name: Retrieval Eval

on:
  workflow_dispatch:
    inputs:
      retriever:
        description: 'Retriever path to evaluate'
        required: false
        default: 'memory'
        type: choice
        options: [memory, chunk, vector, hybrid, hybrid_norerank, rewrite]
  schedule:
    # Weekly deterministic eval — the semantic channel is OFF by default in
    # run_eval, so this is the recurring lexical-quality gate.
    - cron: '47 6 * * 1'

# Full retrieval evaluation — needs the real BGE-M3 embedding model, the
# cross-encoder reranker, and a seeded corpus.  These are heavy (≈4 GB of
# model weights), so this runs on a weekly schedule (or manual dispatch),
# not on every push.  The cheap `--validate-only` gate lives in ci.yml
# instead — that guards dataset consistency at zero model cost; this
# workflow is where retrieval quality is actually measured (the deterministic
# lexical channel is the default and the one the memory gate rests on — the
# self-scored semantic channel is opt-in, never a gate).
#
# Model weights are cached on the runner so repeat runs skip the download.

jobs:
  eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ema
          POSTGRES_PASSWORD: ema123
          POSTGRES_DB: ema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          # requirements.txt pins the CPU torch variant (a platform wheel not
          # on PyPI) — install it from the pytorch index first so the pinned
          # version resolves on Linux CI.  The version is read from
          # requirements.txt (single source of truth) so a bump there can't
          # silently diverge from this workflow.
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-eval-v1

      - name: Download embedding + reranker models
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-m3')"
          python -c "from sentence_transformers import CrossEncoder; CrossEncoder('BAAI/bge-reranker-v2-m3')"

      - name: Seed eval corpus (chunks + memories)
        run: python -m tests.eval.seed --clear --memories

      - name: Run retrieval eval
        run: |
          # `|| 'memory'` covers the cron path where `inputs` is empty.
          RETRIEVER="${{ inputs.retriever || 'memory' }}"
          # Regression gate: for the production-default memory config, fail
          # this step (run_eval exits non-zero) when overall quality drops
          # below the thresholds.  Manually dispatched non-memory retrievers
          # (experiments/baselines) are not gated.
          #
          # Calibrated 2026-08-12 on the seeded 84-query memory corpus with
          # the semantic channel OFF (the default): recall@5=0.917 / mrr=0.787
          # (deterministic lexical baseline — the semantic channel is a
          # self-scored opt-in and never gates, see run_eval --help).  The
          # corpus was reworked 2026-08-12: 15 real-user-phrased queries
          # added, 5 stale seeds rewritten to match the current code, and a
          # content-only-fingerprint bug fixed (12 queries whose fingerprints
          # lived only in `content` could never match the memory retriever's
          # `summary` field).  See tests/eval/reports/baseline/README.md for
          # the full baseline table and per-query miss analysis.
          #
          # recall@5 0.85 allows up to ~13 misses (84 × 0.15) against the
          # measured 7, leaving room for single-run noise; mrr 0.72 sits
          # ~0.07 below the measured 0.787 so it trips on a real ranking
          # regression but not a noise blip.
          GATE_ARGS=""
          if [ "$RETRIEVER" = "memory" ]; then
            GATE_ARGS="--min-recall@5 0.85 --min-mrr 0.72"
          fi
          python -m tests.eval.run_eval --retriever "$RETRIEVER" \
            --report-md tests/eval/reports/eval-report.md \
            --report-json eval-report.json $GATE_ARGS

      - name: Upload eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            tests/eval/reports/eval-report.md
            eval-report.json

  # LLM behavior eval — tool selection / knowledge extraction / final-answer
  # groundedness.  Unlike the retrieval job this needs NO model weights and
  # NO database: each item costs a few real LLM calls via the configured
  # provider.  Requires the LLM_API_KEY secret (plus LLM_BASE_URL when not
  # the provider default).
  #
  # The gate is a MULTI-RUN mean gate (tests/eval/multi_run_gate.py): the
  # eval runs 3 times and the gate trips on the 95% CI *lower bound* of the
  # 3-run mean (mean - t*stdev/sqrt(n)), NOT on any single run's value.
  # LLM output is sampled even with --judge deterministic, so one unlucky
  # draw can swing a headline metric — relation_recall moved 0.531 → 0.344
  # between two runs of the same code — and a single-run floor that straddles
  # that swing flakes CI for no real regression.  Averaging over 3 runs and
  # gating on the CI lower bound swallows single-run noise: a one-off low
  # value barely moves the lower bound, while a sustained quality drop drags
  # the whole distribution down and pushes it below the floor.  A metric
  # fails when ci95_lower < threshold - 0.03; the tolerance (wider than
  # compare_baseline's 0.01) absorbs the small-sample CI width and residual
  # bias, so the gate trips on a real regression, not a noise blip.
  #
  # Thresholds calibrated 2026-08-09 against the committed baseline
  # (tests/eval/reports/llm-eval-baseline.json, commit 4ae4848, --judge
  # deterministic, 0 execution errors / 0 judge degradations); the floors sit
  # ~0.05-0.10 below the measured values so a healthy run passes while a real
  # regression still trips the job.  Recalibrate after an intentional
  # behaviour change (prompt bump, model swap): regenerate the baseline and
  # move the floors to the new measured values.
  #
  # The gate runs --judge deterministic (not the default --judge llm): the
  # deterministic channel is reproducible and independent of the judge LLM's
  # availability.  During calibration (2026-08-09) the configured judge
  # provider (glm-4.7-flash) was rate-limited on both full runs — 429 on
  # 7/8 and 6/8+8/8 answer/e2e judge calls — so every LLM-judged metric was
  # untrustworthy.  A judge outage must degrade the gate to its
  # deterministic channel, not flake the whole job.  Run --judge llm by hand
  # for the semantic groundedness analysis; the CI gate stays deterministic.
  llm-eval:
    name: LLM behavior eval
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
      # Dedicated judge provider for manual --judge llm runs — the judged
      # model must NOT score its own output (self-preference bias inflates
      # every metric).  run_llm_eval hard-fails when --judge llm runs
      # without a configured LLM_JUDGE_* block, so a manual semantic-judge
      # run without these fails loudly instead of silently self-judging.
      LLM_JUDGE_PROVIDER: ${{ secrets.LLM_JUDGE_PROVIDER || '' }}
      LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL || '' }}
      LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY || '' }}
      LLM_JUDGE_BASE_URL: ${{ secrets.LLM_JUDGE_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run LLM behavior eval (3-run mean gate)
        run: |
          # Multi-run gate (see the job comment): the eval runs 3 times and
          # the gate trips on the 95% CI *lower bound* of the 3-run mean, not
          # on any single run's value.  One unlucky low draw (LLM output is
          # sampled even with --judge deterministic) no longer flakes CI; only
          # a sustained quality drop drags the CI lower bound below a floor.
          # Thresholds are the same numbers the old single-run gate used; each
          # metric fails when ci95_lower < threshold - 0.03.
          python -m tests.eval.multi_run_gate --n-runs 3 \
            --judge deterministic \
            --suite tool_selection,extraction,answer \
            --report-dir llm-eval-reports \
            --min-tool-accuracy 0.68 \
            --min-entity-f1 0.68 \
            --min-relation-f1 0.28 \
            --min-fact-coverage 0.90 \
            --min-groundedness 0.95 \
            --min-citation-rate 0.95

      - name: Upload LLM eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-report
          path: |
            llm-eval-reports/

  # End-to-end eval — the full chain "query → real retrieval → answer →
  # judge".  Needs the BGE-M3 embedding model (to embed the query against the
  # seeded corpus), a database (the e2e corpus is seeded here), and the LLM
  # provider (retrieval + answer generation + judge all call the LLM).  So it
  # gets its own postgres + model job rather than riding on `llm-eval`
  # (which has neither) or `eval` (which must stay LLM-free).
  #
  # Gate thresholds calibrated 2026-08-09 against the committed baseline
  # (tests/eval/reports/llm-eval-baseline.json, --judge deterministic):
  # context_recall=1.000, fact_coverage=1.000, groundedness=1.000,
  # citation_rate=1.000 on 8 items.  Floors sit ~0.05-0.10 below so a
  # healthy run passes while a regression trips the job.  Same
  # deterministic-gate rationale as `llm-eval` — see that job's comment.
  e2e-eval:
    name: End-to-end eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ema
          POSTGRES_PASSWORD: ema123
          POSTGRES_DB: ema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
      # Dedicated judge provider for manual --judge llm runs — same
      # requirement as the llm-eval job: semantic e2e groundedness is only
      # meaningful when the judge is a model other than the one answering.
      LLM_JUDGE_PROVIDER: ${{ secrets.LLM_JUDGE_PROVIDER || '' }}
      LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL || '' }}
      LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY || '' }}
      LLM_JUDGE_BASE_URL: ${{ secrets.LLM_JUDGE_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-eval-v1

      - name: Download embedding model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-m3')"

      - name: Seed e2e eval corpus
        # Re-seed from scratch each run: clear the previous run's rows first
        # so the corpus is exactly the e2e labeled set, no accumulation.
        run: python -m tests.eval.e2e_seed --clear

      - name: Run end-to-end eval
        run: |
          # Deterministic gate (see the job comment): thresholds from the
          # committed baseline minus ~0.05-0.10.
          python -m tests.eval.run_llm_eval --suite e2e \
            --judge deterministic \
            --report-md tests/eval/reports/e2e-eval-report.md \
            --report-json e2e-eval-report.json \
            --min-context-recall 0.95 \
            --min-fact-coverage 0.90 \
            --min-groundedness 0.95 \
            --min-citation-rate 0.95

      - name: Upload e2e eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-eval-report
          path: |
            tests/eval/reports/e2e-eval-report.md
            e2e-eval-report.json

  # Task-level end-to-end eval — drives the REAL agent graph (ReAct loop,
  # real tool execution, HITL auto-approved) on the labeled multi-step task
  # set.  Same prerequisites as `e2e-eval` (postgres for the seeded corpus,
  # the embedding model, and the LLM provider), so it is its own job.
  #
  # Gate thresholds deliberately NOT set yet: the floors need a first real
  # run to calibrate (see how the e2e-eval floors were calibrated against a
  # committed baseline).  Add --min-completed / --min-tool-recall /
  # --min-within-budget / --min-fact-coverage / --min-groundedness after the
  # first task-eval-report.md is committed.
  task-eval:
    name: Task-level end-to-end eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ema
          POSTGRES_PASSWORD: ema123
          POSTGRES_DB: ema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          pip install "$(grep -m1 '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-eval-v1

      - name: Download embedding model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-m3')"

      - name: Seed e2e eval corpus
        run: python -m tests.eval.e2e_seed --clear

      - name: Run task-level end-to-end eval
        run: |
          # Deterministic judging for the weekly run: no dedicated judge
          # provider required.  Agent is auto-approved at every HITL gate.
          python -m tests.eval.run_task_eval \
            --judge deterministic \
            --report-md tests/eval/reports/task-eval-report.md \
            --report-json task-eval-report.json

      - name: Upload task eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: task-eval-report
          path: |
            tests/eval/reports/task-eval-report.md
            task-eval-report.json
