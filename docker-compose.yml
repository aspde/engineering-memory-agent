services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ema-postgres
    environment:
      POSTGRES_USER: ema
      POSTGRES_PASSWORD: ema123
      POSTGRES_DB: ema_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ema -d ema_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .
    container_name: ema-backend
    env_file: .env
    environment:
      # Override DB host for the compose network (`.env` points at localhost).
      DATABASE_URL: postgresql://ema:ema123@postgres:5432/ema_dev
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "8000:8000"
    volumes:
      # Embedding model cache (BGE-M3 etc.) - not baked into the image.
      # Bind-mount the host HF cache (set HF_CACHE_DIR in .env to point at
      # an existing ~/.cache/huggingface, no copy; default ./docker/models).
      # Runtime HOME is /home/ema (uid 10001), so sentence-transformers
      # finds the cache here. See docs/deployment.md.
      - ${HF_CACHE_DIR:-./docker/models}:/home/ema/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
