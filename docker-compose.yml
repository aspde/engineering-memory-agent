services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ema-postgres
    environment:
      POSTGRES_USER: ema
      POSTGRES_PASSWORD: ema123
      POSTGRES_DB: ema_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

volumes:
  postgres_data: