[project]
name = "ema"
version = "0.1.0"
description = "Engineering Memory Agent - long-term memory agent for dev teams"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-prebuilt>=1.0",
    "langchain-core>=1.0",
    "openai>=2.0",
    "anthropic>=0.70",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg>=3.0",
    "psycopg-pool>=3.0",
    "pgvector>=0.5",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sentence-transformers>=4.0",
    "httpx>=0.28",
    "pygit2>=1.19",
    "python-multipart>=0.0.30",
    "jieba>=0.42",
    "tiktoken>=0.7",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# starlette.testclient falls back from httpx2 to httpx with a deprecation
# warning; we pin httpx and the fallback is fully supported, so the notice
# is noise in every test run.
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
